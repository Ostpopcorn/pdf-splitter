name: Pytest

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
        os: [ubuntu-latest]
        include:
          # the oldest Python that pdfsplitter supports, which is not built
          # for newer Ubuntu
          - python-version: "3.9"
            os: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install the package
      run: |
        python -m pip install --upgrade pip
        pip install ".[test]"
    - name: Test with pytest
      run: pytest
